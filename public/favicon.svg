<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black square background -->
  <rect width="100" height="100" fill="#0D0D0D"/>
  <!-- Ranked-list mark (white) — 3 descending bars + dot -->
  <!-- Top bar (longest) -->
  <rect x="20" y="37" width="60" height="5" fill="white"/>
  <!-- Middle bar -->
  <rect x="20" y="47" width="36" height="5" fill="white"/>
  <!-- Bottom bar (shortest) -->
  <rect x="20" y="57" width="16" height="5" fill="white"/>
  <!-- Dot — right of bottom bar, vertically centred on it -->
  <circle cx="41" cy="59.5" r="3.5" fill="white"/>
</svg>
